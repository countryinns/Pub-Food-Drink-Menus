<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bold Forester</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      transition: background 0.3s, color 0.3s;
    }
    header, main {
      padding: 1em;
      text-align: center;
    }
    #ticker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #222;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      height: 2em;
      line-height: 2em;
    }
    .scrolling-text {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 15s linear infinite;
      will-change: transform;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    #countdown-timer-container {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Bold Forester</h1>
    <p>Marchwood's local favourite 🍻</p>
  </header>

  <main>
    <h2>Upcoming Event</h2>
    <p>🔥 Father’s Day BBQ starts in: <span id="countdown"></span></p>
  </main>

  <div id="ticker">
    <div class="scrolling-text">
      🍻 Quiz Night this Friday &nbsp;&nbsp;|&nbsp;&nbsp; 🍕 Pizza Wednesdays &nbsp;&nbsp;|&nbsp;&nbsp; 🌞 Garden now open!
    </div>
  </div>

  <script>
    // Countdown Timer
    const eventDate = new Date("2025-06-16T20:00:00");
    function updateCountdown() {
      const now = new Date();
      const diff = eventDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").textContent = "It’s happening now!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Theme Switching (Light/Dark based on time or user preference)
    function applyTheme() {
      const hour = new Date().getHours();
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark || hour < 7 || hour >= 19) {
        document.body.style.background = '#111';
        document.body.style.color = 'white';
      } else {
        document.body.style.background = 'white';
        document.body.style.color = 'black';
      }
    }
    applyTheme();
  </script>
</body>
</html>
